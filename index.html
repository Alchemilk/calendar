<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 科研黄历</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calendar-container">
        <!-- 标题区域 -->
        <header class="app-header">
            <h1 class="app-title"><svg class="title-atom" viewBox="0 0 40 40" width="32" height="32"><defs><linearGradient id="atomGradient" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#FFB347"/></linearGradient></defs><circle cx="20" cy="20" r="3" fill="url(#atomGradient)"/><ellipse cx="20" cy="20" rx="16" ry="7" stroke="url(#atomGradient)" stroke-width="1.5" fill="none"/><ellipse cx="20" cy="20" rx="16" ry="7" stroke="url(#atomGradient)" stroke-width="1.5" fill="none" transform="rotate(60 20 20)"/><ellipse cx="20" cy="20" rx="16" ry="7" stroke="url(#atomGradient)" stroke-width="1.5" fill="none" transform="rotate(120 20 20)"/></svg> 科研黄历</h1>
            <p class="app-subtitle">纯属娱乐，请勿迷信，相信科学！</p>
        </header>

        <div class="calendar">
            <div class="calendar-header">
                <div class="date-nav">
                    <button class="date-nav-btn" id="datePrevBtn" aria-label="上一个月">◀</button>
                    <div class="month-year" id="monthYear"></div>
                    <button class="date-nav-btn" id="dateNextBtn" aria-label="下一个月">▶</button>
                </div>
                <button class="today-btn" id="todayBtn">今天</button>
                <div class="calendar-icon" id="calendarIcon" aria-label="切换视图">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="5" width="18" height="16" rx="2" fill="#FF9A9E" stroke="#FF6B6B" stroke-width="1.5"/>
                        <path d="M3 9H21" stroke="#FF6B6B" stroke-width="1.5"/>
                        <path d="M8 3V7" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M16 3V7" stroke="#FF6B6B" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="8" cy="14" r="1.5" fill="#FF6B6B"/>
                        <circle cx="12" cy="14" r="1.5" fill="#FF6B6B"/>
                        <circle cx="16" cy="14" r="1.5" fill="#FF6B6B"/>
                        <circle cx="8" cy="17" r="1.5" fill="#FF6B6B"/>
                        <circle cx="12" cy="17" r="1.5" fill="#FF6B6B"/>
                    </svg>
                </div>
                <div class="view-popup" id="viewPopup">
                    <div class="view-option" data-view="month">月视图</div>
                    <div class="view-option" data-view="year">年视图</div>
                </div>
            </div>

            <div id="calendarContent">
                <div class="weekdays" id="weekdaysHeader">
                    <div class="weekday">日</div>
                    <div class="weekday">一</div>
                    <div class="weekday">二</div>
                    <div class="weekday">三</div>
                    <div class="weekday">四</div>
                    <div class="weekday">五</div>
                    <div class="weekday">六</div>
                </div>
                <div class="days-grid" id="daysGrid"></div>
            </div>
        </div>

        <!-- 科研运势区域 -->
        <div class="fortune-container" id="fortuneContainer">
            <div class="fortune-card">
                <div class="fortune-header">
                    <span class="fortune-icon">🧪</span>
                    <span class="fortune-title">今日科研运势</span>
                </div>
                <div class="fortune-content" id="fortuneContent">
                    <p class="fortune-text" id="fortuneText">加载中...</p>
                    <div class="fortune-tags" id="fortuneTags"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="app-footer">
        <p>注：每个人访问的结果不会完全相同，仅供娱乐，请相信科学！</p>
    </footer>

    <div class="decoration-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
